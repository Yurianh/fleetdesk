<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>FleetDesk — Vos véhicules, d'un coup d'œil</title>
<link rel="stylesheet" href="../lib/base.css">
<style>
  #panel { left: 24px; top: 24px; width: 592px; height: 464px; }
  .head { position: absolute; left: 52px; top: 50px; }
  .head .title { font-size: 28px; margin-top: 6px; }
  .count { position: absolute; right: 52px; top: 62px; font-size: 14px; color: #71717a; }
  .row { position: absolute; left: 52px; width: 536px; height: 76px; border-top: 1px solid #f4f4f5; }
  .row .ico, #fiche .ico { position: absolute; left: 0; top: 17px; width: 42px; height: 42px; }
  .row .plate { position: absolute; left: 58px; top: 15px; font-weight: 600; font-size: 18px; }
  .row .model { position: absolute; left: 58px; top: 40px; font-size: 13.5px; color: #71717a; }
  .row .chip { position: absolute; right: 120px; top: 23px; }
  .row .km { position: absolute; right: 0; top: 27px; font-size: 15px; color: #52525b; }
  #shape { position: absolute; background: #fff; border: 1px solid #e4e4e7; overflow: hidden; z-index: 5; }
  #rowL { position: absolute; left: 0; top: 0; width: 536px; height: 76px; }
  #fiche { position: absolute; left: 28px; top: 26px; right: 28px; bottom: 26px; }
  #fiche .ico { top: 2px; width: 48px; height: 48px; }
  #fiche .plate { position: absolute; left: 64px; top: 0; font-weight: 600; font-size: 24px; }
  #fiche .model { position: absolute; left: 64px; top: 32px; font-size: 14px; color: #71717a; }
  #fiche > .chip { position: absolute; right: 0; top: 10px; }
  .tile { position: absolute; width: 246px; height: 128px; border: 1px solid #f0f0f1; border-radius: 14px; background: #fafafa; padding: 16px 18px; }
  .tile .val { font-weight: 600; font-size: 22px; margin-top: 10px; display: flex; align-items: center; gap: 10px; }
  .tile .note { margin-top: 10px; }
  .avatar { width: 34px; height: 34px; border-radius: 99px; background: #E5EEFF; color: #0052D6; display: grid; place-items: center; font-size: 12.5px; font-weight: 700; }
  #close { position: absolute; right: 0; top: 330px; font-size: 13.5px; color: #71717a; display: flex; align-items: center; gap: 6px; }
</style>
</head>
<body>
<div id="panel" class="panel"></div>
<div class="head"><div class="label">Véhicules</div><div class="title">Votre flotte</div></div>
<div class="count">14 véhicules</div>
<div id="rows"></div>

<div id="shape">
  <div id="rowL"></div>
  <div id="fiche">
    <div class="ico" id="fIco"></div>
    <div class="plate">EF-456-GH</div>
    <div class="model">Peugeot Boxer · mis en circulation en 2021</div>
    <div class="chip ok"><span class="dot"></span>Actif</div>
    <div class="tile" id="t0" style="left:0;top:78px"><div class="label">Conducteur</div><div class="val"><span class="avatar">SR</span>Sophie Renard</div></div>
    <div class="tile" id="t1" style="left:262px;top:78px"><div class="label">Kilométrage</div><div class="val"><span class="swap" id="km" style="height:28px;width:160px"></span></div><div class="note mute" style="font-size:13px">Relevé hier par Sophie</div></div>
    <div class="tile" id="t2" style="left:0;top:218px"><div class="label">Contrôle technique</div><div class="val">14/03/2027</div><div class="note"><span class="chip ok" style="height:26px;font-size:12.5px"><span class="dot"></span>Valide</span></div></div>
    <div class="tile" id="t3" style="left:262px;top:218px"><div class="label">Prochaine vidange</div><div class="val">dans 4 200 km</div><div class="note"><span class="chip warn" style="height:26px;font-size:12.5px"><span class="dot"></span>À prévoir</span></div></div>
  </div>
</div>
<div id="cursor"></div>

<script type="module">
import { scene, spring, SPRING, track, lerp, clamp, fr, $, ICON, CURSOR_SVG, cursor } from '../lib/motion.js'

const D = 9.0
const T = { click: 1.55, open: 1.65, close: 6.6, shut: 6.7 }
const VEHICLES = [
  ['AB-123-CD', 'Renault Master', 'Actif', '45 200 km'],
  ['EF-456-GH', 'Peugeot Boxer', 'Actif', '31 800 km'],
  ['IJ-789-KL', 'Citroën Jumpy', 'Actif', '78 400 km'],
  ['MN-012-OP', 'Ford Transit', 'Actif', '52 900 km'],
]
const Y0 = 122, H = 76, FOCUS = 1
const rowHTML = ([p, m, st, km]) => `<div class="ico">${ICON.truck(22, '#52525b')}</div><div class="plate">${p}</div><div class="model">${m}</div><div class="chip ok"><span class="dot"></span>${st}</div><div class="km">${km}</div>`
$('rows').innerHTML = VEHICLES.map((v, i) => i === FOCUS ? '' : `<div class="row" style="top:${Y0 + i * H}px">${rowHTML(v)}</div>`).join('')
$('rowL').innerHTML = `<div class="row" style="left:0;top:0;border-top:0">${rowHTML(VEHICLES[FOCUS])}</div>`
$('fIco').innerHTML = ICON.truck(24, '#52525b')
$('cursor').innerHTML = CURSOR_SVG

const ROW = { x: 52, y: Y0 + FOCUS * H, w: 536, h: H }
const OPEN = { x: 40, y: 40, w: 560, h: 432 }

scene({
  duration: D,
  seek(t) {
    // Forme unique : la ligne devient la fiche, puis redevient la ligne.
    const m = track(t, 0, [[T.open, 1], [T.shut, 0]], SPRING.heavy)
    const sh = $('shape')
    Object.assign(sh.style, {
      left: lerp(ROW.x - 1, OPEN.x, m) + 'px', top: lerp(ROW.y - 1, OPEN.y, m) + 'px',
      width: lerp(ROW.w + 2, OPEN.w, m) + 'px', height: lerp(ROW.h + 2, OPEN.h, m) + 'px',
      borderRadius: lerp(10, 18, clamp(m)) + 'px',
      borderColor: m > 0.02 ? '#e4e4e7' : 'transparent',
      boxShadow: `0 ${(20 * clamp(m)).toFixed(1)}px ${(48 * clamp(m)).toFixed(1)}px -20px rgba(24,24,27,${(0.22 * clamp(m)).toFixed(3)})`,
    })
    // Les deux contenus se relaient sans trou : la ligne s'efface pendant que l'en-tête de la fiche arrive.
    $('rowL').style.opacity = clamp((0.5 - m) * 4)
    $('fiche').style.opacity = clamp((m - 0.32) / 0.25)
    // Les tuiles arrivent l'une après l'autre.
    for (let i = 0; i < 4; i++) {
      const k = spring(t - (T.open + 0.35 + i * 0.12), SPRING.default) * (1 - spring(t - (T.shut - 0.1), SPRING.snappy))
      const el = $('t' + i)
      el.style.opacity = clamp(k * 1.3)
      el.style.transform = `translateY(${((1 - k) * 14).toFixed(2)}px)`
    }
    // Le kilométrage défile jusqu'au dernier relevé.
    const kk = spring(t - (T.open + 0.6), SPRING.heavy)
    $('km').innerHTML = `<span class="txt">${fr(Math.round(lerp(31200, 31800, clamp(kk)) / 10) * 10)} km</span>`

    // Curseur : clic sur la ligne, puis clic hors de la fiche pour la refermer.
    cursor($('cursor'), t, {
      from: [700, 560],
      steps: [[0.6, [300, ROW.y + 40]], [T.close - 0.7, [560, 450]], [T.shut + 0.5, [720, 600]]],
    }, [T.click, T.close])
  },
})
</script>
</body>
</html>
