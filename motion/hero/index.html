<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>FleetDesk — hero : les trois « zéro »</title>
<link rel="stylesheet" href="../lib/base.css">
<style>
  /* ── Paysage 16:9 (1536 × 864) ─────────────────────────────────────── */
  html, body { width: 1536px; height: 864px; }
  #board { left: 40px; top: 36px; width: 1456px; height: 792px; border-radius: 22px; }
  .brand { position: absolute; left: 80px; top: 72px; display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 20px; }
  .brand i { width: 34px; height: 34px; border-radius: 8px; background: #0052D6; display: grid; place-items: center; }
  .brand i svg { width: 100%; height: 100%; }
  .h1 { position: absolute; left: 80px; top: 122px; font-size: 40px; }
  .sub { position: absolute; left: 80px; top: 178px; font-size: 18px; color: #71717a; }
  #counter { position: absolute; top: 76px; height: 48px; font-size: 18px; padding: 0 20px; gap: 10px; }
  #counter .dot { width: 9px; height: 9px; }
  .card { position: absolute; top: 240px; width: 442px; height: 480px; border: 1px solid #ececee; border-radius: 18px; background: #fafafa; }
  .card .ic { position: absolute; left: 28px; top: 28px; width: 52px; height: 52px; border-radius: 14px; background: #E5EEFF; display: grid; place-items: center; }
  .card .lab { position: absolute; left: 28px; top: 100px; font-weight: 600; font-size: 22px; }
  .card .cnt { position: absolute; left: 28px; top: 132px; font-size: 16px; color: #71717a; }
  .card .list { position: absolute; left: 28px; right: 28px; top: 250px; }
  .card .li { display: flex; justify-content: space-between; height: 52px; align-items: center; border-top: 1px solid #ececee; font-size: 16px; color: #3f3f46; }
  .card .li span:last-child { color: #71717a; }
  .blk { position: absolute; border: 1px solid; overflow: hidden; z-index: 3; }
  .blk .chipL { position: absolute; inset: 0; display: flex; align-items: center; gap: 9px; padding: 0 15px; font-weight: 600; font-size: 16px; white-space: nowrap; }
  .blk .alert { position: absolute; left: 0; top: 0; right: 0; bottom: 0; padding: 26px 26px; }
  .blk .t { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 20px; height: 26px; }
  .blk .t .swap { height: 26px; width: 290px; }
  .blk .days { position: absolute; right: 26px; top: 24px; font-weight: 600; font-size: 20px; }
  .blk .m { margin-top: 12px; font-size: 16px; color: #3f3f46; height: 22px; position: relative; display: block; }
  .blk .d { margin-top: 6px; font-size: 15px; color: #71717a; height: 21px; position: relative; display: block; }
  .blk .mail { margin-top: 22px; display: flex; align-items: center; gap: 9px; font-size: 15px; color: #52525b; }
  .portrait .blk .mail { display: none; }
  .blk .btn { position: absolute; left: 26px; bottom: 26px; height: 50px; border-radius: 12px; display: flex; align-items: center; gap: 10px; padding: 0 18px; font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; }
  .blk .btn .swap { height: 20px; }
  #summary { position: absolute; left: 0; width: 1536px; top: 752px; font-size: 19px; font-weight: 600; color: #047857; display: flex; justify-content: center; gap: 28px; }
  #summary span { display: inline-flex; align-items: center; gap: 8px; }
  #caption { position: absolute; left: 0; width: 1536px; top: 752px; height: 30px; font-size: 21px; font-weight: 600; color: #27272a; }
  #caption .txt { left: 0; right: 0; text-align: center; }
  #file { position: absolute; left: 0; top: 0; z-index: 40; height: 56px; background: #fff; border: 1px solid #e4e4e7; border-radius: 12px; display: flex; align-items: center; gap: 10px; padding: 0 16px; font-size: 15px; font-weight: 500; white-space: nowrap; box-shadow: 0 14px 30px -14px rgba(24,24,27,.35); }
  #file b { width: 30px; height: 36px; border-radius: 6px; background: #f4f4f5; border: 1px solid #e4e4e7; display: grid; place-items: center; font-size: 8.5px; color: #71717a; }
  #cursor { width: 30px; height: 30px; }

  /* ── Portrait 4:5 (540 × 675), pour le mobile ──────────────────────── */
  html.portrait, .portrait body { width: 540px; height: 675px; }
  .portrait #board { left: 16px; top: 16px; width: 508px; height: 643px; border-radius: 18px; }
  .portrait .brand { left: 36px; top: 34px; font-size: 16px; gap: 9px; }
  .portrait .brand i { width: 28px; height: 28px; border-radius: 8px; }
  .portrait .h1 { left: 36px; top: 72px; font-size: 27px; }
  .portrait .sub { left: 36px; top: 108px; font-size: 12.5px; }
  .portrait #counter { top: 32px; height: 32px; font-size: 13px; padding: 0 12px; gap: 7px; }
  .portrait #counter .dot { width: 7px; height: 7px; }
  .portrait .card { width: 468px; height: 150px; border-radius: 14px; }
  .portrait .card .ic { left: 16px; top: 16px; width: 38px; height: 38px; border-radius: 11px; }
  .portrait .card .ic svg { width: 19px; height: 19px; }
  .portrait .card .lab { left: 66px; top: 16px; font-size: 16px; }
  .portrait .card .cnt { left: 66px; top: 39px; font-size: 12.5px; }
  .portrait .card .list { left: 16px; right: 16px; top: 76px; }
  .portrait .card .li { height: 34px; font-size: 12.5px; }
  .portrait .blk .chipL { font-size: 12.5px; padding: 0 11px; gap: 6px; }
  .portrait .blk .alert { padding: 14px 16px; }
  .portrait .blk .t { font-size: 15px; height: 20px; gap: 7px; }
  .portrait .blk .t .swap { height: 20px; width: 260px; }
  .portrait .blk .days { right: 16px; top: 13px; font-size: 15px; }
  .portrait .blk .m { margin-top: 7px; font-size: 12.5px; height: 17px; }
  .portrait .blk .d { margin-top: 3px; font-size: 12px; height: 16px; }
  .portrait .blk .btn { left: 16px; bottom: 12px; height: 34px; font-size: 12.5px; padding: 0 12px; gap: 7px; border-radius: 9px; }
  .portrait .blk .btn svg { width: 14px; height: 14px; }
  .portrait .blk .btn .swap { height: 16px; }
  .portrait #summary { width: 540px; top: 622px; font-size: 12px; gap: 12px; }
  .portrait #summary svg { width: 13px; height: 13px; }
  .portrait #caption { width: 540px; top: 621px; height: 20px; font-size: 13px; }
  .portrait #file { height: 40px; font-size: 12px; padding: 0 10px; gap: 8px; border-radius: 10px; }
  .portrait #file b { width: 22px; height: 27px; font-size: 7px; }
  .portrait #cursor { width: 22px; height: 22px; }
</style>
</head>
<body>
<div id="board" class="panel"></div>
<div class="brand"><i id="brandIco"></i>FleetDesk</div>
<div class="h1 title">Tableau de bord</div>
<div class="sub">Transports Lemaire · 14 véhicules · 9 conducteurs</div>
<div id="counter" class="chip"><span class="dot"></span><span id="counterTxt" class="swap"></span></div>
<div id="cards"></div>
<div id="summary"></div>
<div id="caption"></div>
<div id="file"><b>PDF</b>visite-medicale-sophie.pdf</div>
<div id="cursor"></div>

<script type="module">
import { scene, spring, SPRING, track, lerp, clamp, mixc, mixh, swapText, $, OK, WARN, ICON, CURSOR_SVG, cursor, press } from '../lib/motion.js'

const PORTRAIT = new URLSearchParams(location.search).get('format') === 'portrait'
if (PORTRAIT) document.documentElement.classList.add('portrait')

// ─── Plans (secondes) ─────────────────────────────────────────────────────
// Un problème à la fois : l'alerte arrive, on laisse le temps de la lire, on la
// règle, on laisse le temps de voir le résultat, puis on passe au suivant.
// Chaque histoire tient dans un segment de 6,4 s qui commence et finit sur la
// même image (repos) : le site peut rejouer une carte en boucle au survol.
// Segments : [1.0, 7.4] contrôle technique, [7.4, 13.8] documents, [13.8, 20.2] entretien.
// Les reporter dans marketing/src/components/HeroSection.jsx s'ils changent.
const D = 24.4
const SEGMENTS = [[1.0, 7.4], [7.4, 13.8], [13.8, 20.2]]
const T = {
  alert: [1.4, 7.8, 14.2],                  // une alerte par segment
  ctClick: 4.2, ctDone: 4.65,               // contrôle technique : planifié
  grab: 10.0, drop: 11.2, docDone: 11.3,    // visite médicale : certificat déposé
  vClick: 17.0, vDone: 17.1,                // vidange : enregistrée
  close: [6.0, 12.4, 18.4],                 // chaque carte se referme, posée avant la fin du segment
  summary: 20.4, summaryOut: 23.4,
}
// Légendes : ce qui se passe, dit en une phrase, le temps que l'œil suive.
const CAPTIONS = PORTRAIT ? [
  [1.7, 'Contrôle technique dans 30 jours : vous êtes prévenu.'], [4.75, 'Planifié en un clic.'], [6.2, ''],
  [8.1, 'Visite médicale de Sophie : repérée 15 jours avant.'], [11.4, 'Certificat déposé : à jour jusqu\u2019en 2031.'], [12.6, ''],
  [14.5, 'Vidange calculée sur le kilométrage réel.'], [17.2, 'Entretien enregistré.'], [18.6, ''],
] : [
  [1.7, 'Le contrôle technique approche : FleetDesk vous prévient 30 jours avant.'], [4.75, 'Planifié en un clic.'], [6.2, ''],
  [8.1, 'La visite médicale de Sophie expire dans 15 jours : repérée à temps.'], [11.4, 'Certificat déposé : à jour jusqu\u2019en 2031.'], [12.6, ''],
  [14.5, 'La vidange approche, calculée sur le kilométrage réel.'], [17.2, 'Entretien enregistré, prochaine dans 30 000 km.'], [18.6, ''],
]
const DONE = [T.ctDone, T.docDone, T.vDone]

// ─── Mise en page par format ──────────────────────────────────────────────
const L = PORTRAIT ? {
  card: i => ({ x: 36, y: 140 + i * 162, w: 468, h: 150 }),
  chip: { w: 74, h: 30, right: 16, top: 16 },
  block: { x: 8, y: 8, w: 452, h: 134 },
  counter: { right: 504, ok: 128, warn: [106, 116, 116], inner: 38, txtH: 17 },
  btnPad: 16, btnH: 34, btnBottom: 12, btnW: [[166, 160], null, [186, 178]], btnInner: 45,
  file: { from: [300, 720], size: [196, 40] },
  cur: { from: [600, 760], out: [620, 780] },
} : {
  card: i => ({ x: 80 + i * 467, y: 240, w: 442, h: 480 }),
  chip: { w: 106, h: 38, right: 28, top: 32 },
  block: { x: 20, y: 172, w: 402, h: 290 },
  counter: { right: 1456, ok: 190, warn: [156, 170, 170], inner: 59, txtH: 22 },
  btnPad: 26, btnH: 50, btnBottom: 26, btnW: [[224, 216], null, [248, 236]], btnInner: 64,
  file: { from: [880, 900], size: [262, 56] },
  cur: { from: [1640, 960], out: [1660, 980] },
}

const CARDS = [
  { ico: ICON.shield, lab: 'Contrôles techniques', cnt: '14 véhicules suivis',
    list: [['AB-123-CD', '14/03/2027'], ['IJ-789-KL', '02/06/2027'], ['MN-012-OP', '19/09/2027']],
    mail: 'Alerte envoyée par e-mail 30 jours avant',
    alert: ['Contrôle technique', '30 j', 'Peugeot Boxer · EF-456-GH', 'Échéance le 05/11/2026'],
    done:  ['Contrôle planifié', '', 'Peugeot Boxer · EF-456-GH', 'RDV jeudi 5 novembre'],
    btn: ['Planifier le contrôle', 'RDV le 5 novembre'], btnIco: 'calendar', booked: ['#E5EEFF', '#0052D6'] },
  { ico: ICON.user, lab: 'Documents conducteurs', cnt: '9 conducteurs suivis',
    list: [['Marc Lefebvre', 'à jour'], ['Karim Aïssa', 'à jour'], ['Nadia Benali', 'à jour']],
    mail: 'Alerte envoyée par e-mail à Thomas',
    alert: ['Visite médicale', '15 j', 'Sophie Renard', 'Expire le 26/10/2026'],
    done:  ['Visite médicale à jour', '', 'Sophie Renard', 'Valide jusqu’au 10/2031'],
    btn: null },
  { ico: ICON.wrench, lab: 'Entretien', cnt: '14 plans d’entretien',
    list: [['IJ-789-KL', 'dans 12 400 km'], ['EF-456-GH', 'dans 4 200 km'], ['MN-012-OP', 'dans 21 300 km']],
    mail: 'Alerte envoyée 5 000 km avant',
    alert: ['Vidange', '4 900 km', 'Renault Master · AB-123-CD', 'Avant 50 000 km au compteur'],
    done:  ['Vidange enregistrée', '', 'Renault Master · AB-123-CD', 'Prochaine dans 30 000 km'],
    btn: ['Enregistrer l’entretien', 'Entretien enregistré'], btnIco: 'check', booked: [OK.bg, OK.fg] },
]

$('brandIco').innerHTML = ICON.brand(34, '#fff')
$('cursor').innerHTML = CURSOR_SVG
$('cards').innerHTML = CARDS.map((c, i) => {
  const r = L.card(i)
  return `<div class="card" id="card${i}" style="left:${r.x}px;top:${r.y}px">
    <div class="ic">${c.ico(24, '#0066FF')}</div><div class="lab">${c.lab}</div><div class="cnt">${c.cnt}</div>
    <div class="list" id="list${i}">${c.list.slice(0, PORTRAIT ? 1 : 3).map(([a, b]) => `<div class="li"><span>${a}</span><span>${b}</span></div>`).join('')}</div>
    <div class="blk" id="blk${i}">
      <div class="chipL" id="chip${i}"><span class="dot"></span>À jour</div>
      <div class="alert" id="al${i}">
        <div class="t"><span class="dot"></span><span class="swap" id="tt${i}"></span></div>
        <div class="days" id="days${i}">${c.alert[1]}</div>
        <div class="m swap" id="mm${i}"></div>
        <div class="d swap" id="dd${i}"></div>
        <div class="mail" id="mail${i}">${ICON.mail(17, '#71717a')}${c.mail}</div>
        ${c.btn ? `<div class="btn" id="btn${i}">${ICON[c.btnIco](18, 'currentColor')}<span class="swap" id="btnTxt${i}"></span></div>` : ''}
      </div>
    </div>
  </div>`
}).join('')
const sumIco = ICON.check(17, '#10B981')
$('summary').innerHTML = ['0 contrôle raté', '0 document expiré', '0 panne surprise'].map(s => `<span>${sumIco}${s}</span>`).join('')

// Repères absolus pour le curseur et le dépôt du certificat.
const btnCenter = i => { const r = L.card(i), b = L.block; return [r.x + b.x + L.btnPad + L.btnW[i][0] * 0.55, r.y + b.y + b.h - L.btnBottom - L.btnH / 2 + 4] }
const DROP = (() => { const r = L.card(1), b = L.block; return [r.x + b.x + b.w * (PORTRAIT ? 0.4 : 0.22), r.y + b.y + b.h * (PORTRAIT ? 0.5 : 0.62)] })()
const counterW = label => label === 'Tout est à jour' ? L.counter.ok : L.counter.warn[Math.min(2, Number(label[0]) - 1)]

window.SEGMENTS = SEGMENTS
scene({
  duration: D,
  seek(t) {
    // Mise en avant : la carte active reste nette, les autres s'estompent.
    const focus = CARDS.map((_, i) => clamp(track(t, 0, [[T.alert[i] - 0.15, 1], [T.close[i] + 0.1, 0]], SPRING.default)))
    CARDS.forEach((c, i) => {
      const r = L.card(i)
      const others = clamp(focus.reduce((sum, f, j) => sum + (j === i ? 0 : f), 0))
      $('card' + i).style.opacity = (1 - 0.6 * others).toFixed(3)
      // 1 = alerte (ambre), 0 = à jour ou réglée (émeraude)
      const wk = clamp(track(t, 0, [[T.alert[i], 1], [DONE[i], 0]], SPRING.default))
      // Forme unique : la pastille « À jour » devient le bloc d'alerte, puis redevient pastille.
      const m = track(t, 0, [[T.alert[i] + 0.12, 1, SPRING.heavy], [T.close[i], 0, SPRING.default]])
      const mk = clamp(m)
      const chipX = r.w - L.chip.right - L.chip.w
      Object.assign($('blk' + i).style, {
        left: lerp(chipX, L.block.x, m) + 'px', top: lerp(L.chip.top, L.block.y, m) + 'px',
        width: lerp(L.chip.w, L.block.w, m) + 'px', height: lerp(L.chip.h, L.block.h, m) + 'px',
        borderRadius: lerp(L.chip.h / 2, PORTRAIT ? 12 : 16, mk) + 'px',
        // Fond : pastille émeraude au repos ; bloc blanc teinté une fois ouvert.
        background: mixc(mixh(OK.bg, '#ffffff', mk), WARN.bg, wk),
        borderColor: mixc(OK.bd, WARN.bd, wk),
        boxShadow: `0 ${(14 * mk).toFixed(1)}px ${(34 * mk).toFixed(1)}px -16px rgba(24,24,27,${(0.2 * mk).toFixed(3)})`,
      })
      $('list' + i).style.opacity = clamp(1 - m * 2.5)
      const chip = $('chip' + i)
      chip.style.opacity = clamp((0.45 - m) * 4)
      chip.style.color = mixc(OK.fg, WARN.fg, wk)
      chip.querySelector('.dot').style.background = mixc(OK.dot, WARN.dot, wk)
      const al = $('al' + i)
      al.style.opacity = clamp((m - 0.55) / 0.3)
      al.querySelector('.dot').style.background = mixc(OK.dot, WARN.dot, wk)
      al.querySelector('.t').style.color = mixc(OK.fg, '#18181b', wk)
      const sw = (el, a, b) => swapText($(el + i), t, t < DONE[i] ? [[0, a]] : [[0, a], [DONE[i], b]], 12)
      sw('tt', c.alert[0], c.done[0]); sw('mm', c.alert[2], c.done[2]); sw('dd', c.alert[3], c.done[3])
      const mk2 = spring(t - (T.alert[i] + 0.55), SPRING.default)
      $('mail' + i).style.opacity = clamp(mk2)
      $('mail' + i).style.transform = `translateY(${((1 - mk2) * 10).toFixed(2)}px)`
      const days = $('days' + i)
      days.style.color = WARN.fg
      days.style.opacity = clamp(1 - spring(t - (DONE[i] - 0.15), SPRING.snappy))

      if (c.btn) {
        const at = i === 0 ? T.ctClick : T.vClick
        const booked = spring(t - (at + 0.1), SPRING.snappy)
        const btn = $('btn' + i)
        btn.style.transform = `scale(${(1 - 0.05 * press(t, at)).toFixed(4)})`
        btn.style.background = mixc('#0066FF', c.booked[0], booked)
        btn.style.color = mixc('#FFFFFF', c.booked[1], booked)
        const bw = lerp(L.btnW[i][0], L.btnW[i][1], clamp(booked))
        btn.style.width = bw + 'px'
        swapText($('btnTxt' + i), t, t < at + 0.1 ? [[0, c.btn[0]]] : [[0, c.btn[0]], [at + 0.1, c.btn[1]]], 12)
        $('btnTxt' + i).style.width = (bw - L.btnInner) + 'px'
      }
    })

    // Compteur : 1, 2, 3 échéances, puis il redescend jusqu'à « Tout est à jour ».
    const steps = [[0, 'Tout est à jour'], [T.alert[0], '1 échéance'], [T.ctDone, 'Tout est à jour'],
                   [T.alert[1], '1 échéance'], [T.docDone, 'Tout est à jour'], [T.alert[2], '1 échéance'], [T.vDone, 'Tout est à jour']]
    const live = steps.filter(([at]) => at <= t)
    swapText($('counterTxt'), t, live.slice(-2), 14)
    const cur = live[live.length - 1], prev = live[live.length - 2] || cur
    const width = lerp(counterW(prev[1]), counterW(cur[1]), spring(t - cur[0], SPRING.snappy))
    const counter = $('counter')
    const ck = clamp(track(t, 0, [[T.alert[0], 1], [T.ctDone, 0], [T.alert[1], 1], [T.docDone, 0], [T.alert[2], 1], [T.vDone, 0]], SPRING.default))
    counter.style.background = mixc(OK.bg, WARN.bg, ck)
    counter.style.color = mixc(OK.fg, WARN.fg, ck)
    counter.style.borderColor = mixc(OK.bd, WARN.bd, ck)
    counter.querySelector('.dot').style.background = mixc(OK.dot, WARN.dot, ck)
    counter.style.width = width + 'px'
    counter.style.left = (L.counter.right - width) + 'px'
    $('counterTxt').style.width = (width - L.counter.inner) + 'px'
    $('counterTxt').style.height = L.counter.txtH + 'px'

    swapText($('caption'), t, [[0, ''], ...CAPTIONS].filter(([at]) => at <= t).slice(-2), 12)

    // Phrase de fin : les trois « zéro » tenus.
    const sk = spring(t - T.summary, SPRING.default) * (1 - spring(t - T.summaryOut, SPRING.default))
    $('summary').style.opacity = clamp(sk * 1.3)
    $('summary').style.transform = `translateY(${((1 - sk) * 12).toFixed(2)}px)`

    // Le certificat est glissé sur la visite médicale.
    const g = spring(t - T.grab, SPRING.default), go = spring(t - (T.grab + 0.3), SPRING.default), d = spring(t - T.drop, SPRING.snappy)
    const fx = lerp(L.file.from[0], DROP[0], go), fy = lerp(lerp(L.file.from[1], L.file.from[1] - 120, g), DROP[1], go)
    const file = $('file')
    file.style.transform = `translate(${fx.toFixed(2)}px, ${fy.toFixed(2)}px) scale(${(1 - 0.25 * d).toFixed(4)}) rotate(${(-3 * (1 - go)).toFixed(2)}deg)`
    file.style.opacity = clamp(g * 2) * (1 - d)

    const [c0x, c0y] = btnCenter(0), [c2x, c2y] = btnCenter(2)
    const fw = L.file.size
    cursor($('cursor'), t, {
      from: L.cur.from,
      steps: [[3.3, [c0x, c0y]], [5.0, L.cur.out], [T.grab - 0.25, [L.file.from[0] + fw[0] * 0.6, L.file.from[1] - 120 + fw[1] * 0.5]],
              [T.grab + 0.3, [DROP[0] + fw[0] * 0.6, DROP[1] + fw[1] * 0.5]], [11.8, L.cur.out], [16.1, [c2x, c2y]], [17.6, L.cur.out]],
    }, [T.ctClick, T.drop, T.vClick])
  },
})
</script>
</body>
</html>
