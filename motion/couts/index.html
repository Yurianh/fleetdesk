<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>FleetDesk — Comprenez vos coûts réels</title>
<link rel="stylesheet" href="../lib/base.css">
<style>
  #panel { left: 24px; top: 24px; width: 592px; height: 464px; }
  .head { position: absolute; left: 52px; top: 50px; }
  .head .title { font-size: 28px; margin-top: 6px; }
  #total { position: absolute; left: 52px; top: 128px; font-weight: 600; font-size: 46px; letter-spacing: -0.02em; height: 56px; width: 260px; }
  #trend { position: absolute; left: 290px; top: 142px; background: #F4F4F5; color: #52525B; border-color: #E4E4E7; }
  .stack { position: absolute; left: 52px; top: 204px; width: 536px; height: 14px; border-radius: 99px; background: #f4f4f5; overflow: hidden; display: flex; gap: 3px; }
  .stack i { height: 100%; }
  .legend { position: absolute; left: 52px; top: 232px; display: flex; gap: 26px; font-size: 14px; color: #52525b; }
  .legend span { display: flex; align-items: center; gap: 8px; }
  .legend b { color: #18181b; font-weight: 600; }
  .sq { width: 10px; height: 10px; border-radius: 3px; }
  .sect { position: absolute; left: 52px; top: 290px; }
  .vrow { position: absolute; left: 52px; width: 536px; height: 46px; }
  .vrow .p { position: absolute; left: 0; top: 2px; font-weight: 600; font-size: 15.5px; width: 110px; }
  .vrow .bar { position: absolute; left: 120px; top: 8px; height: 10px; border-radius: 99px; background: #0066FF; }
  .vrow .amt { position: absolute; right: 0; top: 0; font-weight: 600; font-size: 15.5px; height: 22px; width: 90px; text-align: right; }
  .vrow .amt .txt { left: auto; right: 0; }
  .vrow .why { position: absolute; left: 120px; top: 24px; font-size: 12.5px; color: #71717a; }
</style>
</head>
<body>
<div id="panel" class="panel"></div>
<div class="head"><div class="label">Rapport mensuel</div><div class="title">Dépenses du mois</div></div>
<div id="total" class="swap"></div>
<div id="trend" class="chip"><span id="trIco"></span>+8 % vs le mois dernier</div>
<div class="stack"><i id="s0" style="background:#0066FF"></i><i id="s1" style="background:#16a34a"></i><i id="s2" style="background:#0ea5e9"></i></div>
<div class="legend" id="legend"></div>
<div class="sect label">Véhicules les plus coûteux</div>
<div id="vrows"></div>

<script type="module">
import { scene, spring, SPRING, track, lerp, clamp, fr, $, ICON } from '../lib/motion.js'

// Rythme : le total, puis la répartition, puis les véhicules, un temps chacun.
const D = 13.2
const T = { build: 0.6, reset: 11.4 }
// Répartition cohérente : 1 960 + 1 640 + 242 = 3 842 €
const PARTS = [['Entretien', 1960, '#0066FF'], ['Carburant', 1640, '#16a34a'], ['Lavages', 242, '#0ea5e9']]
const TOTAL = PARTS.reduce((s, p) => s + p[1], 0)
const TOP = [['EF-456-GH', 1120, 'dont 640 € de freins et pneus'], ['AB-123-CD', 860, 'carburant surtout'], ['IJ-789-KL', 540, '']]

$('trIco').innerHTML = ICON.trend(15, '#52525b')
$('legend').innerHTML = PARTS.map(([l, v, c], i) => `<span id="lg${i}"><i class="sq" style="background:${c}"></i>${l} <b>${fr(v)} €</b></span>`).join('')
$('vrows').innerHTML = TOP.map(([p, v, why], i) => `<div class="vrow" style="top:${322 + i * 50}px"><div class="p">${p}</div><div class="bar" id="vb${i}"></div><div class="amt swap" id="va${i}"></div>${why ? `<div class="why" id="vw${i}">${why}</div>` : ''}</div>`).join('')

// Le rapport se construit, puis se vide pour le mois suivant.
const grow = (t, at, cfg = SPRING.heavy) => clamp(spring(t - at, cfg) * (1 - spring(t - T.reset, SPRING.default)), 0, 1.2)

scene({
  duration: D,
  seek(t) {
    const k = grow(t, T.build)
    $('total').innerHTML = `<span class="txt">${fr(Math.round(TOTAL * clamp(k)))} €</span>`
    const tk = grow(t, T.build + 1.6, SPRING.default)
    $('trend').style.opacity = clamp(tk * 1.3)
    $('trend').style.transform = `translateY(${((1 - tk) * 10).toFixed(2)}px)`
    PARTS.forEach(([, v], i) => {
      const s = grow(t, T.build + 2.6 + i * 0.45)
      $('s' + i).style.width = `${(v / TOTAL * 100 * clamp(s)).toFixed(3)}%`
      const lk = grow(t, T.build + 2.8 + i * 0.45, SPRING.default)
      $('lg' + i).style.opacity = clamp(lk * 1.3)
    })
    TOP.forEach(([, v], i) => {
      const s = grow(t, T.build + 5.0 + i * 0.5)
      $('vb' + i).style.width = (300 * v / TOP[0][1] * clamp(s)).toFixed(2) + 'px'
      $('vb' + i).style.background = i === 0 ? '#0066FF' : '#93B8FF'
      $('va' + i).innerHTML = `<span class="txt">${fr(Math.round(v * clamp(s)))} €</span>`
      const w = $('vw' + i)
      if (w) { const wk = grow(t, T.build + 6.8 + i * 0.6, SPRING.default); w.style.opacity = clamp(wk * 1.3); w.style.transform = `translateY(${((1 - wk) * 6).toFixed(2)}px)` }
    })
  },
})
</script>
</body>
</html>
